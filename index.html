<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/starbucks.png" type="image/x-icon"> <!-- ICONE NA ABA -->
    <link rel="stylesheet" href="./style.css"> <!-- CAMINHO CSS -->
    <title>DevClub - StarBucks</title>
</head>

<body>
    <!-- CABEÇALHO -->
    <header>

    <!-- LOGO PRINCIPAL COM UM LINK PARA LOJA OFICIAL -->
        <section>
            <a href="https://www.starbucks.com.br/" target="_blank" title="Link do site oficial" alt="Link do site oficial"> 
                <img class="logo-principal" src="./img/logo.png" alt="Logo do Site"> 
            </a>
        </section>

    <!-- BUTÃO DARK MODE E WHITE MODE -->
        <section>
            <button id="button-dark-white">Dark Mode</button>
        </section>
    </header>

    <main>
    <!-- TÍTULO -->
        <section class="textos-container">
            <h2 class="titulo-starbuck">
                It's not just Coffee<br/>
                It's <span class="texto-starbuck">Starbucks</span>
            </h2>

    <!-- PARAGRAFO -->
            <p class="texto-lorem">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro, blanditiis nisi nesciunt 
                perferendis et nostrum voluptatum quidem maxime odio magni dolore accusamus dolorum esse 
                corporis aut! Facilis sapiente soluta ullam!
            </p>

    <!-- BUTÃO PRICIPAL -->
            <button class="button-starbuck">Clique no Sininho</button>
        </section>

    <!-- BEBIDA EM DESTAQUE -->
        <section class="drink-destaque-container">
            <img class="drink-destaque" src="./img/img1.png" alt="">
        </section>
    </main>

    <!-- MENU DE BEBIDAS -->
    <section class="drinks-container">
        <img class="drinks" src="./img/thumb1.png" alt="" title="" onclick="trocarCor('#017143', '#ff806f'); trocarImg('./img/img1.png')">
        <img class="drinks" src="./img/thumb2.png" alt="" title="" onclick="trocarCor('#eb7495', '#d752b1'); trocarImg('./img/img2.png')">
        <img class="drinks" src="./img/thumb3.png" alt="" title="" onclick="trocarCor('#d752b1', '#293728'); trocarImg('./img/img3.png')">
    </section>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2025 Jerônimo Santos</p>
    </footer>

    <script src="./script.js"></script> <!-- CAMINHO JAVASCRIPT -->
</body>
</html>
